name: CI/CD auf AWS ECS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'biztrips' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'biztrips-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'biztrips-service' }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME || 'biztrips' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Lint ausführen
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build erstellen
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}

  deploy-ecs:
    name: Image nach ECR pushen und ECS-Service aktualisieren
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: AWS-Secrets prüfen
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The GitHub Actions secret $name is required for deployment."
              exit 1
            fi
          done
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          fi

      # Learner Lab: kein OIDC möglich, daher die temporären Session-Credentials als Secrets.
      - name: AWS-Credentials aus Learner-Lab-Session beziehen
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: AWS-Account der Zugangsdaten prüfen
        shell: bash
        run: |
          actual_account_id=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual_account_id" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::AWS_ACCOUNT_ID does not match the account of the configured credentials."
            exit 1
          fi

      - name: Task-Definition für AWS-Account und Region vorbereiten
        run: |
          jq \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            '.executionRoleArn = ("arn:aws:iam::" + $account + ":role/LabRole")
             | .containerDefinitions[].logConfiguration.options["awslogs-region"] = $region' \
            task-definition.json > task-definition.deploy.json

      - name: Bei ECR anmelden
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image-Tags bestimmen
        id: image-tags
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Image bauen und nach ECR pushen
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-tags.outputs.tag }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}
        run: |
          if [[ -z "$VITE_API_BASE_URL" ]]; then
            echo "::error::Set the VITE_API_BASE_URL repository variable to the deployed backend URL."
            exit 1
          fi
          docker build \
            --build-arg VITE_API_BASE_URL \
            --build-arg VITE_IMGS \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          if [[ "${{ steps.image-tags.outputs.publish_latest }}" == "true" ]]; then
            docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          fi

      - name: Task-Definition mit neuem Image aktualisieren
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.deploy.json
          container-name: ${{ vars.ECS_CONTAINER_NAME || 'biztrips' }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'biztrips' }}:${{ steps.image-tags.outputs.tag }}

      - name: ECS-Service deployen
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER || 'biztrips-cluster' }}
          service: ${{ vars.ECS_SERVICE || 'biztrips-service' }}
          wait-for-service-stability: true
